kind: tool
name: nearest_cooling_facilities
type: bigquery-sql
source: heat-bq
description: |
  Returns reconciled inventory candidates with source provenance. Listed indoor sites are not operator-verified cooling destinations. Schools and parks retain unknown AC and public access. Confirm event readiness before dispatching residents. Source periods include legacy schools 2013–2014, imported CPS 2025–2026 and cooling inventory Summer 2024.
statement: |
  SELECT
    facility_type, site_name, address, zip, phone, hours_of_operation, is_indoor,
    ROUND(latitude, 5) AS latitude, ROUND(longitude, 5) AS longitude,
    ROUND(ST_DISTANCE(ST_GEOGPOINT(longitude, latitude), ST_GEOGPOINT(@longitude, @latitude)) / 1000, 2) AS km_away
  FROM `${GOOGLE_CLOUD_PROJECT}.${BQ_ENRICHED_DATASET:a4i_climate_work_v2}.cooling_facilities`
  WHERE (@facility_type = 'any' AND is_indoor) OR facility_type = @facility_type
  ORDER BY km_away
  LIMIT @limit
parameters:
- name: latitude
  type: float
  minValue: 41.0
  maxValue: 43.0
  description: Latitude in decimal degrees (Chicago is about 41.6 to 42.1).
- name: longitude
  type: float
  minValue: -89.0
  maxValue: -87.0
  description: Longitude in decimal degrees (Chicago is about -87.95 to -87.5).
- name: facility_type
  type: string
  default: any
  description: '''any'' (indoor sites only) or one exact facility type, e.g. ''Library''.'
- name: limit
  type: integer
  default: 5
  minValue: 1
  maxValue: 15
  description: How many rows to return (default 5, max 15).
