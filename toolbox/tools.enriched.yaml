kind: tool
name: equity_audit
type: bigquery-sql
source: heat-bq
description: |
  Uses validated enriched context and ACS2024 whole-tract estimates. The air-offset model is the frozen original model; land-cover and surface-offset fields are additional context. Cooling listings and hours are source inventories; event opening, working AC, staffing, capacity and accessibility are unconfirmed. School snapshot membership does not establish current operation or eligibility. Distances are straight-line unless a route is explicitly supplied.
  Audits the OUTPUT of rank_priority_sites. Takes the same top-N recommended sites (same parameters, so pass the same
  values you used for the ranking) and compares the people living in those tracts with the whole modelled city:
  poverty rate, households without a car, share 65+, income, mean vulnerability index, and the share of tracts in the
  top vulnerability quartile. Returns two rows, 'recommended_sites' and 'citywide'. Race is NOT in the model and NOT in
  this table; the audit compares the vulnerabilities the Today track cares about. Report the result whether or not it
  flatters the recommendations.
statement: |
  WITH pred AS (
    -- LIVE model call over every candidate cell, measured or not. EXPLAIN_PREDICT returns the prediction
    -- AND per-feature attributions (degrees F contributed by each feature versus the average cell).
    SELECT *
    FROM ML.EXPLAIN_PREDICT(
      MODEL `${GOOGLE_CLOUD_PROJECT}.${BQ_BASELINE_DATASET:a4i_climate_backup_20261117_214035}.heat_offset_model`,
      (SELECT * FROM `${GOOGLE_CLOUD_PROJECT}.${BQ_ENRICHED_DATASET:a4i_climate_work_v2}.site_context_enriched` WHERE inside_census_chicago_place AND vulnerability_index IS NOT NULL AND pop_density_km2 >= @min_density),
      STRUCT(3 AS top_k_features))
  ),
  scored AS (
    SELECT
      p.*,
      PERCENT_RANK() OVER (ORDER BY p.predicted_offset_f) AS heat_percentile,
      LEAST(IFNULL(p.km_to_cooling, 3), 3) / 3 AS access_gap
    FROM pred AS p
  ),
  ranked AS (
    SELECT
      s.*,
      -- priority = (heat and vulnerability, blended by heat_weight) x (0.6 .. 1.0 by distance from indoor cooling)
      (@heat_weight * s.heat_percentile + (1 - @heat_weight) * s.vulnerability_index)
        * (0.6 + 0.4 * s.access_gap) AS priority_score
    FROM scored AS s
  ),
  spaced AS (
    SELECT r.*
    FROM ranked AS r
    WHERE r.predicted_offset_f >= @min_offset
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY CAST(FLOOR(r.lat_i / @spacing_cells) AS INT64), CAST(FLOOR(r.lon_i / @spacing_cells) AS INT64)
      ORDER BY r.priority_score DESC) = 1
  ),
  top AS (
    SELECT * FROM spaced ORDER BY priority_score DESC LIMIT @limit
  ),
  modelled AS (
    SELECT v.* FROM `${GOOGLE_CLOUD_PROJECT}.${BQ_ENRICHED_DATASET:a4i_climate_work_v2}.tract_vulnerability_2024` AS v
    WHERE v.geo_id IN (SELECT DISTINCT tract_geo_id FROM `${GOOGLE_CLOUD_PROJECT}.${BQ_ENRICHED_DATASET:a4i_climate_work_v2}.site_context_enriched`)
  ),
  picked AS (
    SELECT m.* FROM modelled AS m WHERE m.geo_id IN (SELECT tract_geo_id FROM top)
  )

    SELECT 'recommended_sites' AS group_name,
      COUNT(*) AS tracts,
      CAST(SUM(total_pop) AS INT64) AS population,
      ROUND(SAFE_DIVIDE(SUM(population_below_poverty), SUM(poverty_universe_population)), 3) AS poverty_rate,
      ROUND(SAFE_DIVIDE(SUM(no_car_households), SUM(households)), 3) AS households_without_car_rate,
      ROUND(SAFE_DIVIDE(SUM(pct_65_plus * total_pop), SUM(total_pop)), 3) AS share_65_plus,
      ROUND(SAFE_DIVIDE(SUM(median_income * total_pop), SUM(total_pop)), 0) AS median_income_pop_weighted,
      ROUND(AVG(vulnerability_index), 3) AS mean_vulnerability_index,
      ROUND(COUNTIF(vulnerability_index >= 0.75) / COUNT(*), 3) AS share_in_top_vulnerability_quartile
    FROM picked
  UNION ALL

    SELECT 'citywide' AS group_name,
      COUNT(*) AS tracts,
      CAST(SUM(total_pop) AS INT64) AS population,
      ROUND(SAFE_DIVIDE(SUM(population_below_poverty), SUM(poverty_universe_population)), 3) AS poverty_rate,
      ROUND(SAFE_DIVIDE(SUM(no_car_households), SUM(households)), 3) AS households_without_car_rate,
      ROUND(SAFE_DIVIDE(SUM(pct_65_plus * total_pop), SUM(total_pop)), 3) AS share_65_plus,
      ROUND(SAFE_DIVIDE(SUM(median_income * total_pop), SUM(total_pop)), 0) AS median_income_pop_weighted,
      ROUND(AVG(vulnerability_index), 3) AS mean_vulnerability_index,
      ROUND(COUNTIF(vulnerability_index >= 0.75) / COUNT(*), 3) AS share_in_top_vulnerability_quartile
    FROM modelled
parameters:
- name: limit
  type: integer
  default: 8
  minValue: 1
  maxValue: 50
  description: How many rows to return (default 8, max 50).
- name: heat_weight
  type: float
  default: 0.5
  minValue: 0
  maxValue: 1
  description: Weight on predicted heat versus resident vulnerability in the priority score. 0.5 = equal. 1.0 =
    pure heat ranking, 0.0 = pure vulnerability ranking.
- name: min_density
  type: float
  default: 3000
  minValue: 0
  description: Ignore grid cells with fewer than this many people per km2 nearby (parks, rail yards, industrial
    land are hot but empty). Default 3000 (keeps out airports, rail yards, industrial land and parks).
- name: spacing_cells
  type: integer
  default: 5
  minValue: 1
  maxValue: 20
  description: Keep only the best cell per square block of this many grid cells (1 cell = ~330 m), so stops are
    spread across the city instead of clustered. Default 5 = ~1.7 km apart.
- name: min_offset
  type: float
  default: -99
  minValue: -99
  maxValue: 10
  description: 'Hot cutoff: only consider places whose predicted_offset_f (degrees F vs the city average) is at
    least this. Default -99 = no cutoff. The dispatch console passes the operator''s cutoff here.'
---
kind: tool
name: model_card
type: bigquery-sql
source: heat-bq
description: |
  Uses validated enriched context and ACS2024 whole-tract estimates. The air-offset model is the frozen original model; land-cover and surface-offset fields are additional context. Cooling listings and hours are source inventories; event opening, working AC, staffing, capacity and accessibility are unconfirmed. School snapshot membership does not establish current operation or eligibility. Distances are straight-line unless a route is explicitly supplied.
  How good the heat model really is: ML.EVALUATE on spatially held-out city blocks the model never saw, next to a naive
  'always predict the city average' baseline. Use it to answer "how much should I trust this" and to state limits. If
  the model's r2 is low, say so plainly; the training data is a single volunteer-driven afternoon.
statement: |
  WITH holdout AS (
    SELECT * FROM `${GOOGLE_CLOUD_PROJECT}.${BQ_ENRICHED_DATASET:a4i_climate_work_v2}.site_context_enriched` WHERE n_obs >= 8 AND is_holdout AND offset_f IS NOT NULL
  )
  SELECT 'model on held-out blocks' AS what, ROUND(mean_absolute_error, 2) AS mean_abs_error_f,
         ROUND(SQRT(mean_squared_error), 2) AS rmse_f, ROUND(r2_score, 3) AS r2_score,
         (SELECT COUNT(*) FROM holdout) AS cells_evaluated
  FROM ML.EVALUATE(MODEL `${GOOGLE_CLOUD_PROJECT}.${BQ_BASELINE_DATASET:a4i_climate_backup_20261117_214035}.heat_offset_model`, (SELECT * FROM holdout))
  UNION ALL
  SELECT 'baseline: always predict the city average', ROUND(AVG(ABS(offset_f)), 2),
         ROUND(SQRT(AVG(POW(offset_f, 2))), 2), 0.0, COUNT(*)
  FROM holdout
parameters: []
---
kind: tool
name: model_global_importance
type: bigquery-sql
source: heat-bq
description: |
  Uses validated enriched context and ACS2024 whole-tract estimates. The air-offset model is the frozen original model; land-cover and surface-offset fields are additional context. Cooling listings and hours are source inventories; event opening, working AC, staffing, capacity and accessibility are unconfirmed. School snapshot membership does not establish current operation or eligibility. Distances are straight-line unless a route is explicitly supplied.
  Which features the heat model leans on overall (ML.GLOBAL_EXPLAIN), as mean absolute contribution in degrees F.
  Use to explain what drives heat across Chicago, as opposed to one site.
statement: |
  SELECT feature, ROUND(attribution, 3) AS mean_abs_contribution_f
  FROM ML.GLOBAL_EXPLAIN(MODEL `${GOOGLE_CLOUD_PROJECT}.${BQ_BASELINE_DATASET:a4i_climate_backup_20261117_214035}.heat_offset_model`)
  ORDER BY attribution DESC
parameters: []
---
kind: tool
name: tract_map_layer
type: bigquery-sql
source: heat-bq
description: |
  Returns reconciled inventory candidates with source provenance. Listed indoor sites are not operator-verified cooling destinations. Schools and parks retain unknown AC and public access. Confirm event readiness before dispatching residents. Source periods include legacy schools 2013–2014, imported CPS 2025–2026 and cooling inventory Summer 2024.
statement: |
  WITH pred AS (
    SELECT tract_geo_id, community_area, predicted_offset_f, n_obs, offset_f
    FROM ML.EXPLAIN_PREDICT(MODEL `${GOOGLE_CLOUD_PROJECT}.${BQ_BASELINE_DATASET:a4i_climate_backup_20261117_214035}.heat_offset_model`, (SELECT * FROM `${GOOGLE_CLOUD_PROJECT}.${BQ_ENRICHED_DATASET:a4i_climate_work_v2}.site_context_enriched`), STRUCT(1 AS top_k_features))
  ),
  tract AS (
    SELECT
      tract_geo_id,
      APPROX_TOP_COUNT(community_area, 1)[OFFSET(0)].value AS neighborhood,
      AVG(predicted_offset_f) AS predicted_offset_f,
      COUNT(*) AS cells,
      SUM(IFNULL(n_obs, 0)) AS measured_readings,
      SAFE_DIVIDE(SUM(IF(n_obs >= 8, offset_f * n_obs, 0)), SUM(IF(n_obs >= 8, n_obs, 0)))
        AS measured_offset_f
    FROM pred
    GROUP BY tract_geo_id
  ),
  ac AS (
    SELECT site_name, site_category, ST_GEOGPOINT(longitude, latitude) AS pt
    FROM `${GOOGLE_CLOUD_PROJECT}.${BQ_ENRICHED_DATASET:a4i_climate_work_v2}.chi_site_candidate_sites`
    WHERE is_current_cooling_site AND is_indoor_inventory_listing
  ),
  nearest_ac AS (
    SELECT v.geo_id,
      ARRAY_AGG(STRUCT(a.site_name AS name, a.site_category AS category,
                       ST_DISTANCE(ST_GEOGPOINT(v.tract_lon, v.tract_lat), a.pt) / 1000 AS km)
                ORDER BY ST_DISTANCE(ST_GEOGPOINT(v.tract_lon, v.tract_lat), a.pt) LIMIT 1)[OFFSET(0)] AS best
    FROM `${GOOGLE_CLOUD_PROJECT}.${BQ_ENRICHED_DATASET:a4i_climate_work_v2}.tract_vulnerability_2024` AS v CROSS JOIN ac AS a
    WHERE v.geo_id IN (SELECT tract_geo_id FROM tract)
    GROUP BY v.geo_id
  ),
  geo AS (
    SELECT geo_id, ST_GEOGFROMGEOJSON(geojson, make_valid => TRUE) AS tract_geom
    FROM `${GOOGLE_CLOUD_PROJECT}.${BQ_ENRICHED_DATASET:a4i_climate_work_v2}.tract_boundaries_2024`
    WHERE geo_id IN (SELECT tract_geo_id FROM tract)
  )
  SELECT
    t.tract_geo_id, t.neighborhood,
    ROUND(v.tract_lat, 5) AS latitude, ROUND(v.tract_lon, 5) AS longitude,
    ROUND(t.predicted_offset_f, 2) AS predicted_offset_f,
    t.measured_readings, ROUND(t.measured_offset_f, 2) AS measured_offset_f, t.cells,
    CAST(ROUND(v.total_pop) AS INT64) AS total_pop,
    CAST(ROUND(v.pop_65_plus) AS INT64) AS pop_65_plus,
    ROUND(v.pct_65_plus, 3) AS pct_65_plus,
    ROUND(v.poverty_rate, 3) AS poverty_rate,
    ROUND(v.no_vehicle_rate, 3) AS no_vehicle_rate,
    CAST(ROUND(v.no_car_households) AS INT64) AS households_without_car,
    ROUND(v.median_income, 0) AS median_income,
    ROUND(v.vulnerability_index, 3) AS vulnerability_index,
    ROUND(ST_AREA(g.tract_geom) / 1e6, 3) AS area_km2,
    n.best.name AS nearest_ac_name, n.best.category AS nearest_ac_category, ROUND(n.best.km, 2) AS km_to_ac,
    ST_ASGEOJSON(ST_SIMPLIFY(g.tract_geom, 15)) AS geometry
  FROM tract AS t
  JOIN `${GOOGLE_CLOUD_PROJECT}.${BQ_ENRICHED_DATASET:a4i_climate_work_v2}.tract_vulnerability_2024` AS v ON v.geo_id = t.tract_geo_id
  LEFT JOIN geo AS g ON g.geo_id = t.tract_geo_id
  LEFT JOIN nearest_ac AS n ON n.geo_id = t.tract_geo_id
  ORDER BY t.tract_geo_id
parameters: []
---
kind: tool
name: list_sites
type: bigquery-sql
source: heat-bq
description: |
  Returns reconciled inventory candidates with source provenance. Listed indoor sites are not operator-verified cooling destinations. Schools and parks retain unknown AC and public access. Confirm event readiness before dispatching residents. Source periods include legacy schools 2013–2014, imported CPS 2025–2026 and cooling inventory Summer 2024.
statement: |
  SELECT
    s.site_key, s.site_name, s.site_category, s.operator, s.address,
    ROUND(s.latitude, 5) AS latitude, ROUND(s.longitude, 5) AS longitude,
    s.readiness_status, s.candidate_status, s.identity_review_required, s.has_source_coordinate_conflict, s.is_indoor_inventory_listing, s.is_current_cooling_site, s.indoor_air_conditioned, s.open_24_7, s.hours_of_operation,
    l.service_hours, l.phone
  FROM `${GOOGLE_CLOUD_PROJECT}.${BQ_ENRICHED_DATASET:a4i_climate_work_v2}.chi_site_candidate_sites` AS s
  LEFT JOIN `${GOOGLE_CLOUD_PROJECT}.${BQ_BASELINE_DATASET:a4i_climate_backup_20261117_214035}.chi_site_libraries` AS l
    ON s.site_category = 'Library' AND LOWER(TRIM(l.branch_)) = LOWER(TRIM(s.site_name))
  WHERE @category = 'any' OR s.site_category = @category
  ORDER BY s.site_category, s.site_name
parameters:
- name: category
  type: string
  default: any
  description: '''any'' for every site, or one exact site_category such as ''Library'' or ''Police District''.'
